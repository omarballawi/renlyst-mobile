name: Fast unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install
      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: renlyst-pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No generated Xcode workspace found."
            exit 1
          fi
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No unsigned app bundle found."
            exit 1
          fi

          mkdir -p artifact/Payload
          cp -R "$app_path" artifact/Payload/
          (
            cd artifact
            ditto -c -k --sequesterRsrc --keepParent Payload Renlyst-Next-unsigned.ipa
            shasum -a 256 Renlyst-Next-unsigned.ipa > Renlyst-Next-unsigned.ipa.sha256
            shasum -a 256 -c Renlyst-Next-unsigned.ipa.sha256
          )

          archive="artifact/Renlyst-Next-unsigned.ipa"
          unzip -t "$archive"
          info_plist="$(unzip -Z1 "$archive" 'Payload/*.app/Info.plist' | head -1)"
          if [[ -z "$info_plist" ]]; then
            echo "The IPA does not contain Payload/*.app/Info.plist."
            exit 1
          fi
          echo "Verified $archive with $info_plist"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: renlyst-next-unsigned-ipa
          path: |
            artifact/Renlyst-Next-unsigned.ipa
            artifact/Renlyst-Next-unsigned.ipa.sha256
          if-no-files-found: error
