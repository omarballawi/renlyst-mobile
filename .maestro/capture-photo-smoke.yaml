appId: com.renlyst.app.next
name: Crop, hash, save, and reopen a package image
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn: 'Capture first package'
- tapOn: 'Open fast capture'
- scrollUntilVisible:
    element:
      id: 'capture-photo-library'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'capture-photo-library'
- runFlow: partials/pick-first-image.yaml
- extendedWaitUntil:
    visible: 'Frame the useful evidence.'
    timeout: 15000
- tapOn: 'Use this crop'
- assertVisible: '1/8 selected'
- tapOn:
    id: 'capture-active-ingredient'
- inputText: 'Furosemide'
- tapOn:
    id: 'capture-brand'
- inputText: 'Lasix'
- tapOn:
    id: 'capture-strength'
- inputText: '40 mg'
- tapOn:
    id: 'capture-dosage-form'
- inputText: 'Tablet'
- hideKeyboard
- tapOn: 'Save and open profile'
- extendedWaitUntil:
    visible: 'Furosemide package'
    timeout: 30000
- assertVisible: 'Package preview.*Brands & packages.*'
- tapOn: 'Back'
- tapOn:
    id: 'tab-library'
- assertVisible: 'Furosemide'
