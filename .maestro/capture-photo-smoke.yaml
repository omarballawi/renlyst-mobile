appId: com.renlyst.app.next
name: Crop, hash, save, and reopen a package image
---
- runFlow: partials/open-renlyst.yaml
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'today-add'
- tapOn: 'Open fast capture'
- scrollUntilVisible:
    element:
      id: 'capture-photo-library'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'capture-photo-library'
- runFlow: partials/pick-first-image.yaml
- extendedWaitUntil:
    visible: 'Frame the useful evidence.'
    timeout: 15000
- tapOn: 'Use this crop'
- extendedWaitUntil:
    visible: '1/8 selected'
    timeout: 45000
- scrollUntilVisible:
    element:
      id: 'capture-active-ingredient'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'capture-active-ingredient'
- waitForAnimationToEnd:
    timeout: 5000
- setClipboard: 'Furosemide'
- pasteText
- hideKeyboard
- extendedWaitUntil:
    visible: 'Furosemide'
    timeout: 10000
- tapOn:
    id: 'capture-brand'
- waitForAnimationToEnd:
    timeout: 5000
- setClipboard: 'Lasix'
- pasteText
- hideKeyboard
- extendedWaitUntil:
    visible: 'Lasix'
    timeout: 10000
- tapOn:
    id: 'capture-save-open'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'drug-profile-root'
    timeout: 30000
- assertVisible: 'Furosemide package'
- assertVisible: 'Package preview.*Brands & packages.*'
- tapOn: 'Back'
- tapOn:
    id: 'tab-library'
- assertVisible: 'Furosemide'
