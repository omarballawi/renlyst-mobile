appId: com.renlyst.app.next
name: Crop, hash, save, and reopen a package image
---
- launchApp
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'today-add'
- tapOn: 'Open fast capture'
- scrollUntilVisible:
    element:
      id: 'capture-photo-library'
    direction: DOWN
    timeout: 15000
- tapOn:
    id: 'capture-photo-library'
- runFlow: partials/pick-first-image.yaml
- extendedWaitUntil:
    visible: 'Frame the useful evidence.'
    timeout: 15000
- tapOn: 'Use this crop'
- assertVisible: '1/8 selected'
- scrollUntilVisible:
    element:
      id: 'capture-active-ingredient'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'capture-active-ingredient'
- inputText: 'Furosemide'
- tapOn:
    id: 'capture-brand'
- inputText: 'Lasix'
- tapOn:
    text: 'Save and open profile'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Furosemide package'
    timeout: 30000
- assertVisible: 'Package preview.*Brands & packages.*'
- tapOn: 'Back'
- tapOn:
    id: 'tab-library'
- assertVisible: 'Furosemide'
