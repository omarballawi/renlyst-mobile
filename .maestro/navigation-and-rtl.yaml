appId: com.renlyst.app.next
name: Core navigation, backup, and live Arabic RTL
---
- launchApp
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'tab-you'
- scrollUntilVisible:
    element:
      text: 'Backup & Data'
    direction: DOWN
- tapOn: 'Backup & Data'
- assertVisible: 'Own every record.'
- assertVisible: 'Export complete backup'
- tapOn: 'Back'
- scrollUntilVisible:
    element:
      text: 'Appearance & language'
    direction: DOWN
- tapOn:
    id: 'language-ar'
- assertVisible:
    id: 'language-ar-selected'
- tapOn:
    id: 'tab-today'
- assertVisible:
    id: 'today-screen'
- tapOn:
    id: 'tab-you'
- scrollUntilVisible:
    element:
      id: 'language-en'
    direction: DOWN
- tapOn:
    id: 'language-en'
- assertVisible:
    id: 'language-en-selected'
