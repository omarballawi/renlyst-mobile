appId: com.renlyst.app.next
name: Protected provider settings save and reopen without exposing keys
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'tab-you'
- scrollUntilVisible:
    element:
      text: 'Providers & protected keys'
    direction: DOWN
- tapOn: 'Providers & protected keys'
- extendedWaitUntil:
    visible:
      id: 'provider-settings-(ready|safe-error)'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: 'provider-settings-ready'
    commands:
      - tapOn: 'OpenRouter API key'
      - inputText: 'ci-openrouter-placeholder'
      - tapOn: 'DeepSeek API key'
      - inputText: 'ci-deepseek-placeholder'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            text: 'Save provider settings'
          direction: DOWN
          timeout: 15000
      - tapOn: 'Save provider settings'
      - extendedWaitUntil:
          visible: 'Settings saved on this device.'
          timeout: 10000
      - tapOn: 'Close provider settings'
      - scrollUntilVisible:
          element:
            text: 'Providers & protected keys'
          direction: DOWN
      - tapOn: 'Providers & protected keys'
      - assertVisible: 'SAVED ON THIS DEVICE'
- runFlow:
    when:
      visible:
        id: 'provider-settings-safe-error'
    commands:
      - assertVisible:
          id: 'provider-settings-safe-error'
      - assertVisible:
          id: 'provider-settings-retry'
