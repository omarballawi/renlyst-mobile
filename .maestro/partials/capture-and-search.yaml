appId: com.renlyst.app.next
---
- runFlow: open-renlyst.yaml
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'today-add'
- tapOn: 'Open fast capture'
- tapOn:
    id: 'capture-active-ingredient'
- inputText: 'Furosemide'
- tapOn:
    id: 'capture-brand'
- inputText: 'Lasix'
- tapOn:
    id: 'capture-save-open'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'drug-profile-root'
    timeout: 20000
- assertVisible: 'Furosemide'
- assertVisible: 'Lasix'
- assertVisible: 'Three memory anchors'
- tapOn: 'Back'
- tapOn:
    id: 'tab-library'
- tapOn:
    id: 'library-search'
- inputText: 'Lasix'
- assertVisible: 'Furosemide'
