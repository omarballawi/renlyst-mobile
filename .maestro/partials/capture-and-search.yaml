appId: com.renlyst.app.next
---
- launchApp
- extendedWaitUntil:
    visible: 'Make today stick.'
    timeout: 20000
- tapOn:
    id: 'today-add'
- tapOn: 'Open fast capture'
- tapOn:
    id: 'capture-active-ingredient'
- inputText: 'Furosemide'
- tapOn:
    id: 'capture-brand'
- inputText: 'Lasix'
- tapOn:
    text: 'Save and open profile'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Furosemide'
    timeout: 20000
- assertVisible: 'Lasix'
- assertVisible: 'Three memory anchors'
- tapOn: 'Back'
- tapOn:
    id: 'tab-library'
- tapOn:
    id: 'library-search'
- inputText: 'Lasix'
- assertVisible: 'Furosemide'
